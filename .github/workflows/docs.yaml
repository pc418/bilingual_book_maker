name: Publish docs
on:
  push:
    branches:
      - main

# This fork's default workflow token is read-only, so `mkdocs gh-deploy`
# could not push gh-pages: "Permission to ... denied to github-actions[bot]".
# Granted here rather than by widening the repository-wide default, so only
# this job can write.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs gh-deploy --force
