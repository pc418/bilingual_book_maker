name: Release PyPI

# Publishing only needs to read the repo and upload with the API token below;
# it never writes back to the repo, so keep least privilege.
permissions:
  contents: read

on:
  push:
    tags:
      - "*"

# Never cancel a publish mid-flight; just don't run two for the same tag at once.
concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pypi:
    name: Build and Release PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build artifacts
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
